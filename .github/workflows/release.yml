name: Release

on:
  push:
    # Trigger on any tag that looks like a version, with or without a 'v' prefix.
    # Obsidian's automated review requires release tags to be the bare semver
    # (e.g. '0.2.0'), not 'v0.2.0'.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Update versions.json
        run: |
          node -e "
            const fs = require('fs');
            const m = require('./manifest.json');
            let v = {};
            try { v = JSON.parse(fs.readFileSync('versions.json', 'utf8')); } catch {}
            v[m.version] = m.minAppVersion;
            fs.writeFileSync('versions.json', JSON.stringify(v, null, 2) + '\n');
          "

      - name: Compute release tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package zip
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          zip -j "pi-chat-${VERSION}.zip" main.js styles.css manifest.json versions.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          # Attach files individually. Obsidian's automated review explicitly
          # requires main.js, manifest.json, and styles.css to be uploaded as
          # separate release assets — bundling them inside pi-chat-X.Y.Z.zip
          # alone causes the "missing main.js" / "missing manifest.json"
          # warnings to fire.
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
            pi-chat-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}